name: feed

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# A pull request runs test and build. It does not commit versions or publish the feed.
# A push to main does. The Monday run publishes only when a pin changed.
jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.built == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml

  deploy:
    needs: [build, publish]
    if: always() && github.ref == 'refs/heads/main' && needs.build.result != 'cancelled' && needs.build.outputs.built == 'true' && needs.publish.result != 'cancelled' && needs.publish.result != 'skipped'
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml

  # GitHub disables schedules in public repos after 60 days without activity.
  keepalive:
    if: github.event_name == 'schedule'
    permissions:
      actions: write
    uses: ./.github/workflows/keepalive.yml
