name: pages

on:
  push:
    branches: [main]
    paths: [packages/**, index.py, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: python3 index.py
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages
      - id: deploy
        uses: actions/deploy-pages@v5.0.1
